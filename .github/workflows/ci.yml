# Checks every pull request and push. A merge to main also deploys to production, in the order
# that keeps each step compatible with the one before: database migrations, then the MCP function,
# then the web app.
#
# Production needs, in the repository settings (Settings → Secrets and variables → Actions):
#   secrets  SUPABASE_ACCESS_TOKEN  Supabase personal access token (supabase.com → Account → Access Tokens)
#            VERCEL_TOKEN           Vercel token (vercel.com → Account Settings → Tokens)
#   vars     SUPABASE_PROJECT_REF   attrxmtjyjzfgopfrgnk
#            VERCEL_ORG_ID          orgId in .vercel/project.json
#            VERCEL_PROJECT_ID      projectId in .vercel/project.json
name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build the app
        run: npm run build
      - name: Build the MCP function
        run: npm run mcp:build

  integration:
    name: Migrations and tests on a real Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The local stack loads the functions too, and the MCP function's bundle is generated.
      - name: Build the MCP function
        run: npm run mcp:build
      - name: Start Supabase (applies every migration)
        run: npx supabase start -x imgproxy,logflare,vector,supavisor,studio
      - name: Expose its URL and key to the tests
        run: |
          npx supabase status -o env > supabase.env
          echo "VITE_SUPABASE_URL=$(grep '^API_URL=' supabase.env | cut -d'"' -f2)" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$(grep '^PUBLISHABLE_KEY=' supabase.env | cut -d'"' -f2)" >> "$GITHUB_ENV"
      - name: Store, RLS and live changes
        run: npm run test:integration -- --retry=1
      - name: Serve the MCP function
        run: |
          npx supabase functions serve mcp > functions.log 2>&1 &
          # Ready when it answers 200: while it boots, the gateway answers 502.
          for attempt in $(seq 1 90); do
            curl -sf -o /dev/null "$VITE_SUPABASE_URL/functions/v1/mcp/oauth-protected-resource" && exit 0
            sleep 2
          done
          echo "::error::The MCP function did not start"
          exit 1
      - name: MCP end to end
        run: npm run test:mcp -- --retry=1
      - name: Function logs
        if: failure()
        run: cat functions.log || true

  deploy:
    name: Deploy to production
    needs: [check, integration]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://retro-summer-memo.com
    # One deploy at a time, and never cancel one halfway.
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Check the configuration
        run: |
          missing=""
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing in Settings → Secrets and variables → Actions:$missing"
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Database migrations
        run: npx supabase db push --remote="$SUPABASE_PROJECT_REF" --skip-vault --yes
      - name: MCP function
        run: |
          npm run mcp:build
          npx supabase functions deploy mcp --no-verify-jwt --remote="$SUPABASE_PROJECT_REF" --yes
      - name: Web app on Vercel
        run: |
          npx --yes vercel@66.2.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@66.2.0 build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@66.2.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
      - name: Smoke test
        run: |
          curl -fsS -o /dev/null https://retro-summer-memo.com/
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://retro-summer-memo.com/mcp -H 'content-type: application/json' -d '{}')
          [ "$status" = "401" ] || { echo "::error::The MCP should ask for sign-in (401), got $status"; exit 1; }
